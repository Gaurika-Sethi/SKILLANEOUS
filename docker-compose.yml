version: "3.8"

services:
  redis:
    image: redis
    container_name: ats-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    container_name: ats-backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_URL=redis://redis:6379
    restart: always